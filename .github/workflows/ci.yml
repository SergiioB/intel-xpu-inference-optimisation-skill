name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run skill unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Smoke test CLI helpers
        run: |
          python3 skills/intel-xpu-inference-optimisation/scripts/b70_ceiling.py \
            --spec skills/intel-xpu-inference-optimisation/examples/inkling2-mini-b70.json
          python3 skills/intel-xpu-inference-optimisation/scripts/b70_preflight.py --json >/dev/null
